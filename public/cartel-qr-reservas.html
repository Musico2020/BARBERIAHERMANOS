<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salón Hermanos · Cartel QR de Reservas</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0b0d;
      color: #f4f4f5;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .no-print-bar {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      background: #D9AD50;
      color: #0b0b0d;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(217, 173, 80, 0.4);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: #e5b95d;
      transform: translateY(-1px);
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: radial-gradient(circle at 50% 0%, #1f1d17 0%, #0e0e11 100%);
      border: 2px solid #D9AD50;
      border-radius: 28px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(217, 173, 80, 0.15);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(217, 173, 80, 0.3);
      border-radius: 20px;
      pointer-events: none;
    }

    .corner-decor {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: #D9AD50;
    }
    .top-left { top: 12px; left: 12px; border-top: 2px solid; border-left: 2px solid; }
    .top-right { top: 12px; right: 12px; border-top: 2px solid; border-right: 2px solid; }
    .bottom-left { bottom: 12px; left: 12px; border-bottom: 2px solid; border-left: 2px solid; }
    .bottom-right { bottom: 12px; right: 12px; border-bottom: 2px solid; border-right: 2px solid; }

    .logo-badge {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 800;
      color: #D9AD50;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .sub-badge {
      font-size: 11px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 24px;
    }

    .qr-container {
      background: #FFFFFF;
      padding: 16px;
      border-radius: 20px;
      display: inline-block;
      margin: 0 auto 24px auto;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 0 4px rgba(217, 173, 80, 0.4);
    }

    .qr-container img {
      display: block;
      width: 230px;
      height: 230px;
    }

    .headline {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .instruction {
      font-size: 13px;
      color: #d4d4d8;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .highlight {
      color: #D9AD50;
      font-weight: 600;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(217, 173, 80, 0.4), transparent);
      margin: 16px 0;
    }

    .footer-info {
      font-size: 11px;
      color: #71717a;
      letter-spacing: 0.5px;
    }

    .footer-url {
      font-size: 12px;
      font-weight: 600;
      color: #D9AD50;
      margin-top: 4px;
    }

    @media print {
      body {
        background: none;
        padding: 0;
        justify-content: flex-start;
      }
      .no-print-bar {
        display: none;
      }
      .card {
        box-shadow: none;
        margin: 20px auto;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
